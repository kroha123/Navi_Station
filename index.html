<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #141414;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

@font-face {
  font-family: 'SFPro';
  src: url('SFPro.ttf') format('truetype');
  font-weight: 400;
}

body {
  font-family: 'SFPro', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* 
  Centering strategy:
  - .frame is 402px wide, absolutely positioned
  - left = max(safe-area+30px, 50vw - 201px)
  - this centers on wide screens, but keeps min 30px on phones
  - top = safe-area-inset-top (so content starts below Dynamic Island)
*/
.frame {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: env(safe-area-inset-top, 0px);
  width: 402px;
  height: 874px;
}

/* Veturilo Logo: x=126 y=150 w=150 h=76 */
.logo {
  position: absolute;
  left: 126px;
  top: 150px;
  width: 150px;
  height: 76px;
}
.logo svg {
  width: 150px;
  height: 76px;
  display: block;
}

/* Search field: x=30 y=407 w=272 h=60 */
.search-field {
  position: absolute;
  left: 30px;
  top: 407px;
  width: 272px;
  height: 60px;
  background: #282828;
  border-radius: 30px;
  display: flex;
  align-items: center;
  padding-left: 15px;
  gap: 15px;
}

.icon-box {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Search icon: #3C3C3C by default, red when active */
.search-icon-svg {
  color: #3C3C3C;
  transition: color 0.2s;
}
.search-field.active .search-icon-svg {
  color: #ED1C24;
}

.search-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: #FFFFFF;
  font-family: 'SFPro', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 24px;
  font-weight: 400;
  caret-color: #ED1C24;
  padding-right: 15px;
}
.search-input::placeholder { color: #3C3C3C; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

/* Station name: x=30 y=477 w=342 (272+10+60) h=60 */
.station-name {
  position: absolute;
  left: 30px;
  top: 477px;
  width: 342px;
  height: 60px;
  background: #282828;
  border-radius: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 15px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.station-name.visible { opacity: 1; }
.station-name span {
  color: #FFFFFF;
  font-family: 'SFPro', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 24px;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 312px;
  text-align: center;
}

/* Nav button: x=312 y=407 w=60 h=60 */
.btn-nav {
  position: absolute;
  left: 312px;
  top: 407px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: #282828;
  transition: background 0.2s, transform 0.12s;
  -webkit-tap-highlight-color: transparent;
}
/* Inactive: arrow color = #141414 (invisible against #282828? No — matches bg of page, 
   but button bg is #282828. Use #282828 to hide arrow within button) */
.btn-nav .nav-icon-svg {
  color: #141414;
  transition: color 0.2s;
}
.btn-nav.active {
  background: #ED1C24;
}
.btn-nav.active .nav-icon-svg {
  color: #FFFFFF;
}
.btn-nav:active { transform: scale(0.9); }
</style>
</head>

const stMap = {};
STATIONS.forEach(s => stMap[s.n] = s);
let current = null;

const searchInput     = document.getElementById('searchInput');
const searchField     = document.getElementById('searchField');
const stationName     = document.getElementById('stationName');
const stationNameText = document.getElementById('stationNameText');
const btnNav          = document.getElementById('btnNav');

searchInput.addEventListener('focus', () => searchField.classList.add('active'));
searchInput.addEventListener('blur', () => {
  if (!searchInput.value) searchField.classList.remove('active');
});

searchInput.addEventListener('input', () => {
  let val = searchInput.value.replace(/\D/g, '').slice(0, 4);
  if (searchInput.value !== val) searchInput.value = val;

  if (val) searchField.classList.add('active');
  else searchField.classList.remove('active');

  if (!val) {
    current = null;
    btnNav.classList.remove('active');
    stationName.classList.remove('visible');
    return;
  }

  const found = stMap[val];
  if (found) {
    current = found;
    btnNav.classList.add('active');
    stationNameText.textContent = found.name;
    stationName.classList.add('visible');
  } else {
    current = null;
    btnNav.classList.remove('active');
    if (val.length === 4) {
      stationNameText.textContent = 'Nie znaleziono stacji';
      stationName.classList.add('visible');
    } else {
      stationName.classList.remove('visible');
    }
  }
});

btnNav.addEventListener('click', () => {
  if (!current) return;
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${current.lat},${current.lng}&travelmode=driving`, '_blank');
});
</script>
